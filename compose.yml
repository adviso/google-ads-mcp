services:
  google-ads-mcp:
    build:
      context: ..
      dockerfile: ads/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - GOOGLE_OAUTH_DATA_DIR=/data/google_oauth
    volumes:
      - google-oauth-data:/data/google_oauth
      # ADC for GCP Secret Manager in local dev
      - ${HOME}/.config/gcloud:/home/appuser/.config/gcloud:ro

volumes:
  google-oauth-data:
